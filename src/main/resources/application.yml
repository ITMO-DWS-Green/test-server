server:
  port: 8080
  tomcat:
    threads:
      max: 100   # меньше потоков — зависание (HANG) быстрее исчерпывает сервис, как в жизни

spring:
  application:
    name: test-server
  task:
    scheduling:
      pool:
        size: 4  # экспорт в log-collector не должен задерживать остальные задачи
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [${TESTSERVER_SERVICENAME:test-service}] [%X{traceId:-}] %logger{30} - %msg%n"

testserver:
  service-name: test-service
  downstream: []
  # Адреса всех экземпляров (так они называются в docker compose).
  peers:
    gateway: http://gateway:8080
    orders: http://orders:8080
    payments: http://payments:8080
    database: http://database:8080
  traffic:
    rps: 0
  collector:
    url: ""
    scenario-id: manual
    export-interval-ms: 1000
    crash-label-seconds: 30
  playbooks-dir: playbooks
